    <rect x="352" y="386" width="680" height="150" rx="10" fill="#141412" stroke="#3D3D3A"/>
    <text x="374" y="410" font-size="12" fill="#6B6A65">dashboard.ts</text>
    <g font-family="Consolas, 'Cascadia Code', monospace" font-size="12.5">
      <line x1="352" y1="418" x2="1032" y2="418" stroke="#262624"/>
      <text x="374" y="444"><tspan fill="#D97757">const</tspan><tspan fill="#F0EEE6"> tracks = </tspan><tspan fill="#D9A05B">2_481</tspan><tspan fill="#F0EEE6">;</tspan></text>
      <text x="374" y="465"><tspan fill="#D97757">const</tspan><tspan fill="#F0EEE6"> genres = [</tspan><tspan fill="#8FBF8F">"House"</tspan><tspan fill="#F0EEE6">, </tspan><tspan fill="#8FBF8F">"Drum"</tspan><tspan fill="#F0EEE6">, </tspan><tspan fill="#8FBF8F">"Ambient"</tspan><tspan fill="#F0EEE6">];</tspan></text>
      <text x="374" y="486"><tspan fill="#D97757">async function</tspan><tspan fill="#7AA7D9"> loadStats</tspan><tspan fill="#F0EEE6">(files) {</tspan></text>
      <text x="374" y="507" fill="#F0EEE6">  <tspan fill="#D97757">const</tspan> recent = files.<tspan fill="#7AA7D9">filter</tspan>(f =&gt; f.played7d);</text>
      <text x="374" y="528"><tspan fill="#6B6A65" font-style="italic">// rendered live in the preview panel</tspan></text>
