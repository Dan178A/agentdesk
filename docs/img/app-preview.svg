    <rect x="352" y="192" width="680" height="100" rx="12" fill="#262624" stroke="#3D3D3A"/>
    <path d="M374 218 l6 7 l6 -7" stroke="#A8A79E" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
